version = 1

# Auto-generated version file (cannot have persistent headers)
[[annotations]]
path = "src/calendaring_sync/_version.py"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Bare version string, no comment syntax available
[[annotations]]
path = ".python-version"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# PEP 561 marker file, must be empty
[[annotations]]
path = "src/calendaring_sync/py.typed"
precedence = "override"
SPDX-FileCopyrightText = "2026 calendaring-sync contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
