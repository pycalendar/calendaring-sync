# Tool settings for the scripts on this branch. Nothing here is packaged.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# calendaring-sync's own rules, plus the families editors commonly add.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "BLE", "FURB", "RUF", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["_common"]

[tool.ruff.lint.per-file-ignores]
# Quoted RFC sentences stay on one line each so they read exactly as the RFC prints them.
"sync-design/probes/cite_check.py" = ["E501"]

[tool.pyright]
# The probes import their shared helpers as a sibling module.
extraPaths = ["sync-design/probes"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
