[build-system]
requires = ["hatchling>=1.32.4", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "calendaring-sync"
description = "Calendar sync state: sync tokens, object versions, change tracking and conflict detection"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sashank Bhamidi" }]
dynamic = ["version"]
keywords = ["calendar", "calendaring", "sync", "synchronization", "conflict-detection", "cache"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "coverage==7.16.2",
  "pytest-cov==7.1.0",
]

[project.urls]
Repository = "https://github.com/pycalendar/calendaring-sync"
Issues = "https://github.com/pycalendar/calendaring-sync/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/calendaring_sync/_version.py"

[tool.hatch.build]
# Excludes dotfiles and top-level files with an extension by default, so a new
# local-only file at the repo root (an editor config, a local notes file) does
# not silently end up in the sdist just because it is not in .gitignore.
exclude = [
  "/.*",
  "/*.*",
  "/dist",
  "/build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/calendaring_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["calendaring_sync"]

[tool.pytest.ini_options]
testpaths = ["src/calendaring_sync/tests"]
