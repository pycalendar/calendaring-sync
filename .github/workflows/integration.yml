name: Integration Tests

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          set +e
          pytest src/calendaring_sync/tests/test_sync_integration.py
          ec=$?
          # Exit 5 = no tests collected. Expected until the first adapter lands
          # its integration tests; anything else is a genuine failure.
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 5 ]; then
            exit "$ec"
          fi
